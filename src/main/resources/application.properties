# Database
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
jwt.secret=${JWT_SECRET}

debug=false

# for deployment only
server.servlet.context-path=/api  


file.upload-dir=${FILE_UPLOAD_DIR}
app.base-url=${APP_BASE_URL}

# JPA & Liquibase
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Server
server.port=8080

# Devtools
spring.devtools.livereload.enabled=true
spring.devtools.restart.enabled=false
spring.mvc.log-request-details=true
spring.session.store-type=none

# Your app
logging.level.com.wssoftwares.ikutibnb_backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# SMS Configuration
sms.provider=${SMS_PROVIDER:mock}
sms.account-sid=${SMS_ACCOUNT_SID:}
sms.auth-token=${SMS_AUTH_TOKEN:}
sms.from-number=${SMS_FROM_NUMBER:+255747978832}

# NextSMS Configuration (https://nextsms.co.tz/)
nextsms.api-key=${NEXTSMS_API_KEY}
nextsms.api-secret=${NEXTSMS_API_SECRET}
nextsms.endpoint=${NEXTSMS_ENDPOINT}
nextsms.from-name=${NEXTSMS_FROM_NAME}

# Scheduling Configuration
spring.task.scheduling.enabled=true
spring.task.scheduling.pool.size=2


# OAuth2 Google - Web
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=https://api.njiwaapp.com/api/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=email

# OAuth2 Google - Mobile
spring.security.oauth2.client.registration.google-mobile.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google-mobile.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google-mobile.scope=profile,email
spring.security.oauth2.client.registration.google-mobile.redirect-uri=https://api.njiwaapp.com/api/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google-mobile.client-name=Google
spring.security.oauth2.client.registration.google-mobile.provider=google


# Mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.default-encoding=${MAIL_ENCODING}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Management & health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.redis.enabled=false

# Logging
logging.level.org.hibernate.tool.schema=ERROR
logging.level.org.hibernate.engine.jdbc.env.internal.LobCreatorBuilderImpl=WARN


# health

management.server.port=8080
