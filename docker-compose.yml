version: "3.8"

services:
  backend:
    image: wssoftwares/ikutibnb-backend:latest
    container_name: ikutibnb-backend
    restart: unless-stopped
    ports:
      - "8080:8080"

    volumes:
      - uploads-data:/opt/ikutibnb/uploads

    environment:
      # Database
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/dalalimsomi
      - SPRING_DATASOURCE_USERNAME=baby
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - DB_URL=jdbc:postgresql://postgres:5432/dalalimsomi
      - DB_USERNAME=baby
      - DB_PASSWORD=${DB_PASSWORD}

      # JPA
      - SPRING_JPA_HIBERNATE_DDL_AUTO=create
      - SPRING_JPA_SHOW_SQL=false
      - SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT=org.hibernate.dialect.PostgreSQLDialect
      - SPRING_LIQUIBASE_ENABLED=false

      # Spring
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080

      # Security
      - JWT_SECRET=${JWT_SECRET}

      # OAuth

      # OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

      # Mail

      # Mail
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCODING=${MAIL_ENCODING:-UTF-8}

      # Logging

      # Logging
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_COM_IKUTIBNB=DEBUG

      # App
      - APP_BASE_URL=https://dalalimsomi.worldspringsoftwares.com
      - FILE_UPLOAD_DIR=/opt/ikutibnb/uploads

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - ikutibnb-network

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:15
    container_name: ikutibnb-postgres
    restart: unless-stopped

    environment:
      - POSTGRES_DB=dalalimsomi
      - POSTGRES_USER=baby
      - POSTGRES_PASSWORD=${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - ikutibnb-network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U baby -d dalalimsomi" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
    driver: local
  uploads-data:
    driver: local

networks:
  ikutibnb-network:
    driver: bridge
